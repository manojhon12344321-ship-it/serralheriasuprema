function renderTabs(){const el=document.getElementById('tabs');el.innerHTML=TABS.map(t=>`<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.page=1;render()})}
function renderFilters(){const el=document.getElementById('filters');const chips=[{label:'Todas',val:''},...CATS.map(c=>({label:c,val:c}))];el.innerHTML=chips.map(c=>`<span class="chip ${state.cat===c.val?'active':''}" data-cat="${c.val}">${c.label}</span>`).join('');el.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{state.cat=ch.dataset.cat;state.page=1;render()})}
function getFiltered(){let list=[...ALL];if(state.tab==='tip')list=list.filter(i=>i._kind==='tip');if(state.tab==='perf')list=list.filter(i=>i._kind==='perf');if(state.tab==='jc')list=list.filter(i=>i._kind==='tip'&&(i.codigo.indexOf('JC200')===0||i.codigo.indexOf('JC300')===0));if(state.tab==='portabox')list=list.filter(i=>i._kind==='tip'&&(i.codigo.indexOf('PORTA')===0||i.codigo.indexOf('BOX')===0));if(state.tab==='fachada')list=list.filter(i=>i._kind==='tip'&&i.codigo.indexOf('FACHADA')===0);if(state.tab==='guarda')list=list.filter(i=>i._kind==='tip'&&(i.codigo.indexOf('GUARDA')===0||i.codigo.indexOf('MAXIM')===0||i.codigo.indexOf('BASCULE')===0||i.codigo.indexOf('FIXO')===0));if(state.cat)list=list.filter(i=>(i.categoria||'').toLowerCase()===state.cat.toLowerCase());if(state.q){const q=state.q.toLowerCase();list=list.filter(i=>i.search.indexOf(q)>=0)}return list}
function renderGrid(){const filtered=getFiltered();const total=filtered.length;const pages=Math.max(1,Math.ceil(total/state.perPage));if(state.page>pages)state.page=pages;const start=(state.page-1)*state.perPage;const slice=filtered.slice(start,start+state.perPage);const grid=document.getElementById('grid');if(!slice.length){grid.innerHTML=`<div class="empty">Nenhum resultado para "${state.q}"</div>`}else{grid.innerHTML=slice.map(item=>{if(item._kind==='tip'){return `<div class="card"><div class="k"><span class="code">${item.codigo}</span> • ${item.categoria} • ${item.tipo}</div><div class="title">${item.nome}</div><div class="desc">${item.descricao}</div><div class="perfis">${item.perfis.map(p=>`<span class="pill">${p}</span>`).join('')}</div><div class="foot"><span>ID ${item.id}</span><span>Tipologia</span></div></div>`}else{return `<div class="card"><div class="k"><span class="code">${item.codigo}</span> • ${item.linha} • ${item.tipo}</div><div class="title">${item.nome}</div><div class="desc">${item.descricao}</div><div class="foot"><span>${item.categoria}</span><span>Perfil • ID ${item.id}</span></div></div>`}}).join('')}const pag=document.getElementById('pag');let html='';html+=`<button class="btn" ${state.page<=1?'disabled':''} data-p="${state.page-1}">‹ Anterior</button>`;let s=Math.max(1,state.page-2),e=Math.min(pages,s+6);if(e-s<6)s=Math.max(1,e-6);for(let i=s;i<=e;i++)html+=`<button class="btn ${i===state.page?'primary':''}" data-p="${i}">${i}</button>`;html+=`<span class="btn" style="pointer-events:none">${total} itens • ${pages} págs</span>`;html+=`<button class="btn" ${state.page>=pages?'disabled':''} data-p="${state.page+1}">Próxima ›</button>`;pag.innerHTML=html;pag.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{state.page=parseInt(b.dataset.p);window.scrollTo({top:0,behavior:'smooth'});renderGrid()});document.getElementById('sTip').textContent=TIPOLOGIAS.length;document.getElementById('sPerf').textContent=PERFIS.length}

async function tryFetchJSON(paths){for(const p of paths){try{const r=await fetch(p);if(!r.ok)continue;const j=await r.json();return {data:j,path:p}}catch(e){}}return null}
async function loadAll(){const tipPaths=["./Tipologias.json","./data/tipologias.json","Tipologias.json"];const perfPaths=["./Perfis.json","./data/perfis.json","Perfis.json"];const tRes=await tryFetchJSON(tipPaths);const pRes=await tryFetchJSON(perfPaths);let used=[];if(tRes){TIPOLOGIAS=tRes.data.map(normalizeTip);used.push(tRes.path)}else{TIPOLOGIAS=FALLBACK_TIPOLOGIAS.map(normalizeTip);used.push('fallback embutido tipologias')}if(pRes){PERFIS=pRes.data.map(normalizePerf);used.push(pRes.path)}else{PERFIS=FALLBACK_PERFIS.map(normalizePerf);used.push('fallback embutido perfis')}ALL=[...TIPOLOGIAS,...PERFIS];document.getElementById('sStatus').textContent=used.join(' + ')+' ✓ offline-ready';render()}
